name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Lint code
      run: npm run lint || echo "Linting completed with warnings"
      
    - name: Type check
      run: npm run build
      
    - name: Verify plugin files
      run: |
        if [ ! -f main.js ]; then
          echo "❌ main.js not generated"
          exit 1
        fi
        if [ ! -f manifest.json ]; then
          echo "❌ manifest.json missing"
          exit 1
        fi
        if [ ! -f styles.css ]; then
          echo "❌ styles.css missing"
          exit 1
        fi
        echo "✅ All required plugin files present"
        
    - name: Check plugin size
      run: |
        MAIN_SIZE=$(wc -c < main.js)
        echo "Plugin size: ${MAIN_SIZE} bytes"
        if [ "$MAIN_SIZE" -gt 1000000 ]; then
          echo "⚠️  Plugin is quite large (>1MB)"
        fi

  compatibility-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Validate manifest.json
      run: |
        if ! jq empty manifest.json; then
          echo "❌ Invalid JSON in manifest.json"
          exit 1
        fi
        echo "✅ manifest.json is valid JSON"
        
    - name: Check required fields
      run: |
        REQUIRED_FIELDS=("id" "name" "version" "minAppVersion" "description" "author")
        for field in "${REQUIRED_FIELDS[@]}"; do
          if ! jq -e ".$field" manifest.json > /dev/null; then
            echo "❌ Missing required field: $field"
            exit 1
          fi
        done
        echo "✅ All required manifest fields present"